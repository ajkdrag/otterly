[package]
name = "otterly"
version = "0.4.1"
description = "Local-first markdown vault"
authors = ["altamkhan"]
edition = "2021"
autotests = false

[lib]
name = "otterly_lib"
path = "src/lib.rs"

[[bin]]
name = "otterly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.95"
blake3 = "1.5.5"
# Parser only. The default features add a CLI and syntax highlighting (a C
# regex library) that we never use.
comrak = { version = "0.50.0", default-features = false }
mime_guess = "2.0.5"
notify = "7.0.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "~2.3"
tauri-plugin-window-state = "2"
tokio = { version = "1.43.0", features = ["fs", "rt-multi-thread", "sync"] }
# Local repos only. The default features add HTTPS and SSH transports, which
# pull in OpenSSL and libssh2 and slow the build down a lot.
git2 = { version = "0.19", default-features = false }
walkdir = "2.5.0"
# Already built for comrak. We use it to treat combining marks as tag chars.
unicode_categories = "0.1.1"
# Already in Cargo.lock (comrak's caseless pulls it in). Tag keys are NFC.
unicode-normalization = "0.1.25"
# Already built for tauri (url's idna uses it). We use it for the emoji tag
# chars (Extended_Pictographic), which std and unicode_categories do not have.
icu_properties = "2.1.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "~2.4.0"
