[package]
name = "otterly"
version = "0.7.0"
description = "Local-first markdown vault"
authors = ["altamkhan"]
edition = "2021"
autotests = false

[lib]
name = "otterly_lib"
path = "src/lib.rs"

[[bin]]
name = "otterly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.95"
blake3 = "1.5.5"
# Parser only. The default features add a CLI and syntax highlighting (a C
# regex library) that we never use.
comrak = { version = "0.50.0", default-features = false }
# Vault find: ripgrep's parallel walker and glob matcher, plus the regex crate.
globset = "0.4.20"
ignore = "0.4.33"
mime_guess = "2.0.5"
notify = "7.0.0"
regex = "1.13.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
tauri = { version = "2", features = [] }
# Vim's "+p reads the clipboard natively. 2.3.3 is the newest release that
# works with the tauri in Cargo.lock (later ones need tauri 2.12).
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "~2.3"
tauri-plugin-window-state = "2"
tokio = { version = "1.43.0", features = ["fs", "rt-multi-thread", "sync"] }
# Local repos only. The default features add HTTPS and SSH transports, which
# pull in OpenSSL and libssh2 and slow the build down a lot.
git2 = { version = "0.19", default-features = false }
walkdir = "2.5.0"
# Already built for comrak. We use it to treat combining marks as tag chars.
unicode_categories = "0.1.1"
# Already in Cargo.lock (comrak's caseless pulls it in). Tag keys are NFC.
unicode-normalization = "0.1.25"
# Already built for tauri (url's idna uses it). We use it for the emoji tag
# chars (Extended_Pictographic), which std and unicode_categories do not have.
icu_properties = "2.1.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "~2.4.0"

# The taskbar jump list's New Window (app/jump_list.rs) talks to the shell
# directly, because Tauri has no API for it, and a second launch hands its
# foreground right to the running process (app/mod.rs). Tauri already builds
# windows 0.61.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

# The Dock menu's New Window talks to AppKit directly, because Tauri has no
# API for it. Vim mode turns the accent menu for held keys off
# (vim::set_press_and_hold) through NSUserDefaults. Tauri already builds these
# crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
