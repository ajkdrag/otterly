name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build or refresh
        required: true
        type: string
      source_ref:
        description: Git ref to checkout for the release build
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing_preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tmp_file="$(mktemp)"
          printf 'signing-preflight\n' > "$tmp_file"
          pnpm tauri signer sign "$tmp_file" >/dev/null
          rm -f "$tmp_file" "$tmp_file.sig"

  create_release:
    needs: signing_preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Ensure draft release exists
        id: ensure_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --draft \
              --title "Otterly $TAG_NAME" \
              --notes "Desktop release for macOS, Windows, and Linux."
          fi

          release_id=$(gh release view "$TAG_NAME" --json id --jq '.id')

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: macos-x64
            os: macos-latest
            target_key: darwin-x86_64
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
            args: --target x86_64-apple-darwin
          - job_name: macos-arm64
            os: macos-latest
            target_key: darwin-aarch64
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
            args: --target aarch64-apple-darwin
          - job_name: windows-x64
            os: windows-latest
            target_key: windows-x86_64
            rust_targets: ""
            bundle_root: src-tauri/target/release/bundle
            args: ""
          - job_name: linux-x64
            os: ubuntu-22.04
            target_key: linux-x86_64
            rust_targets: ""
            bundle_root: src-tauri/target/release/bundle
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Restores the dependency cache that rust_cache.yml keeps warm on main.
      # A tag run can only read caches from itself or main, so saving here
      # would only fill the cache quota with entries nothing reads again.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target_key }}
          save-if: false

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Prepare Windows signing inputs
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "WINDOWS_SIGNING_ENABLED=false" >> $env:GITHUB_ENV
            exit 0
          }

          $certificateDir = Join-Path $env:RUNNER_TEMP "windows-certificate"
          $certificateTextPath = Join-Path $certificateDir "certificate.txt"
          $certificatePath = Join-Path $certificateDir "otterly-signing.pfx"

          New-Item -ItemType Directory -Force -Path $certificateDir | Out-Null
          Set-Content -Path $certificateTextPath -Value $env:WINDOWS_CERTIFICATE
          certutil -decode $certificateTextPath $certificatePath

          "WINDOWS_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_TIMESTAMP_URL=http://timestamp.digicert.com" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_ENABLED=true" >> $env:GITHUB_ENV

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0.6.1
        env:
          # Mermaid's dependency tree pushes vite build past Node's default
          # ~2GB heap on the 7GB runners.
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_PATH: ${{ env.WINDOWS_CERTIFICATE_PATH }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ env.WINDOWS_SIGNING_TIMESTAMP_URL }}
        with:
          releaseId: ${{ needs.create_release.outputs.release_id }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # The portable zip is the plain release binary plus portable.txt. The
      # app looks for that file to turn off its installer based updater.
      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stageDir = Join-Path $env:RUNNER_TEMP "otterly-portable"
          $zipName = "otterly_${version}_x64_portable.zip"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item src-tauri/target/release/otterly.exe $stageDir
          Copy-Item src-tauri/windows/portable.txt $stageDir

          # Skips by itself when the certificate secrets are not set.
          & scripts/sign_windows.ps1 -FilePath (Join-Path $stageDir "otterly.exe")

          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipName -Force
          gh release upload $env:TAG_NAME $zipName --clobber

      # appimage.github.io lints the AppDir with `[ -e .DirIcon ]`, and -e
      # follows symlinks. Older tauri CLIs (before 2.12) wrote .DirIcon as an
      # absolute symlink into the runner's build dir, so it dangled on every
      # other machine. Extract the real artifact and check it the same way.
      - name: Check AppImage has a usable .DirIcon
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_path="$(ls "$PWD"/${{ matrix.bundle_root }}/appimage/*.AppImage)"
          extract_dir="$(mktemp -d)"
          cd "$extract_dir"
          "$appimage_path" --appimage-extract >/dev/null

          for required in AppRun .DirIcon; do
            if [ ! -e "squashfs-root/$required" ]; then
              echo "::error::$required is missing or a dangling symlink in $appimage_path"
              ls -la squashfs-root
              exit 1
            fi
          done

          # Resolving on the runner hides an absolute link, so reject those too.
          dir_icon_target="$(readlink squashfs-root/.DirIcon || true)"
          case "$dir_icon_target" in
            /*)
              echo "::error::.DirIcon is an absolute symlink to $dir_icon_target"
              exit 1
              ;;
          esac

  finalize_release:
    needs: [create_release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The manifest is built from what is on the release, so it can only
      # point at uploaded installers, each with its own signature.
      - name: Fetch release asset names and updater signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --json assets --jq '[.assets[].name]' > release-assets.json
          gh release download "$TAG_NAME" --pattern '*.sig' --dir release-signatures

      - name: Build updater manifest
        run: |
          node scripts/build_latest_json.mjs \
            --release-assets=release-assets.json \
            --signatures-dir=release-signatures \
            --repo=${{ github.repository }} \
            --tag=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }} \
            --output=latest.json

      - name: Upload updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG_NAME" latest.json --clobber

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
